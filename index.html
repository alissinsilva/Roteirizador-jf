<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roteirizador de Entregas</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { padding: 20px; background-color: #f4f4f9; }
        .container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { margin-bottom: 12px; color: #333; font-size: 1.2rem; }
        textarea { width: 100%; height: 180px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; resize: vertical; margin-bottom: 10px; }
        button { width: 100%; padding: 12px; background-color: #ffe600; color: #2d3277; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        button:hover { background-color: #e6cf00; }
        #map { height: 300px; border-radius: 6px; margin-top: 15px; }
        ol { padding-left: 20px; margin-top: 10px; }
        li { margin-bottom: 8px; line-height: 1.4; }
        .status { margin-top: 10px; font-weight: bold; color: #555; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Cole sua Lista de Entregas</h2>
        <textarea id="listaEntregas" placeholder="Cole aqui o texto contendo os endereços do aplicativo...&#10;Exemplo:&#10;Pacote 1: Rua São Mateus 500, Juiz de Fora&#10;Pacote 2: Av Rio Branco 2000, Juiz de Fora"></textarea>
        <button onclick="processarERoteirizar()">Gerar Rota Otimizada</button>
        <div id="status" class="status"></div>
    </div>

    <div class="card">
        <h2>Ordem Otimizada de Entrega</h2>
        <ol id="resultadoRota"></ol>
        <div id="map"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map = L.map('map').setView([-21.764, -43.350], 13); // Coordenadas iniciais
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    let markers = [];

    // Função para extrair endereços do texto colado
    function extrairEnderecos(texto) {
        let linhas = texto.split('\n');
        return linhas.map(l => l.trim()).filter(l => l.length > 5);
    }

    // Busca de coordenadas via Nominatim (Geocoding)
    async function buscarCoordenadas(endereco) {
        try {
            let res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(endereco)}`);
            let data = await res.json();
            if (data && data.length > 0) {
                return { endereco, lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
            }
        } catch (e) { console.error(e); }
        return null;
    }

    // Algoritmo de otimização (Vizinho Mais Próximo)
    function otimizarRota(pontos) {
        if (pontos.length === 0) return [];
        let rota = [pontos[0]];
        let naoVisitados = pontos.slice(1);

        while (naoVisitados.length > 0) {
            let ultimo = rota[rota.length - 1];
            let maisProximoIdx = 0;
            let menorDistancia = Infinity;

            for (let i = 0; i < naoVisitados.length; i++) {
                let d = Math.hypot(naoVisitados[i].lat - ultimo.lat, naoVisitados[i].lon - ultimo.lon);
                if (d < menorDistancia) {
                    menorDistancia = d;
                    maisProximoIdx = i;
                }
            }
            rota.push(naoVisitados[maisProximoIdx]);
            naoVisitados.splice(maisProximoIdx, 1);
        }
        return rota;
    }

    async function processarERoteirizar() {
        let texto = document.getElementById('listaEntregas').value;
        let status = document.getElementById('status');
        let listaUI = document.getElementById('resultadoRota');
        
        listaUI.innerHTML = '';
        markers.forEach(m => map.removeLayer(m));
        markers = [];

        let enderecos = extrairEnderecos(texto);
        if (enderecos.length === 0) {
            status.innerText = "Por favor, cole ao menos um endereço válido.";
            return;
        }

        status.innerText = "Localizando endereços no mapa...";
        let pontos = [];

        for (let end of enderecos) {
            let ponto = await buscarCoordenadas(end);
            if (ponto) pontos.push(ponto);
            // Pausa pequena para evitar bloqueio da API pública
            await new Promise(r => setTimeout(r, 800));
        }

        if (pontos.length === 0) {
            status.innerText = "Nenhum endereço foi encontrado. Verifique a lista.";
            return;
        }

        status.innerText = "Otimizando a melhor rota...";
        let rotaOtimizada = otimizarRota(pontos);

        // Atualiza a tela
        let bounds = [];
        rotaOtimizada.forEach((p, idx) => {
            let li = document.createElement('li');
            li.innerHTML = `<strong>Parada ${idx + 1}:</strong> ${p.endereco} <br><a href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}" target="_blank" style="color: #2d3277;">Abrir no GPS</a>`;
            listaUI.appendChild(li);

            let marker = L.marker([p.lat, p.lon]).addTo(map).bindPopup(`${idx + 1}. ${p.endereco}`);
            markers.push(marker);
            bounds.push([p.lat, p.lon]);
        });

        map.fitBounds(bounds);
        status.innerText = "Rota otimizada com sucesso!";
    }
</script>
</body>
</html>
